<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../downloads/vue.global-3.5.44.js"></script>
</head>
<body>
    <div id="app">
        {{msg}}

        <h2>title: {{ web.title }}</h2>
        <h2>url: {{ web.url }}</h2>
    </div>
    <script>
        Vue.createApp({
            setup() {
                const web = Vue.reactive({
                    title: "haha",
                    url: "https://baidu.com"
                })

                return {
                    msg: "你好！",
                    web
                };
            }
        }).mount("#app ")

    </script>
</body>
</html>
