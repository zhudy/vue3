<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        {{msg}}

        <h2>title: {{ web.title }}</h2>
        <h2>url: {{ web.url }}</h2>
        <h2>num: {{num}}</h2>
        <h2 v-show="web.show">user: {{web.user}}</h2>
        <button v-show="web.show" v-on:click="edit">修改url</button><br>
        <button @click="edit">修改url-简写形式</button><hr>
        回车 <input type="text" @keyup.enter="add(10,20)"><hr>
        空格键 <input type="text" @keyup.space="add(100,100)"><hr>
        w <input type="text" @keyup.w="add(1,1)"><hr>
        Tab <input type="text" @keydown.tab="add(2,2)"><hr>
        Ctrl+Enter <input type="text" @keyup.ctl.enter="add(200,200)"><hr>
        Ctrl+A <input type="text" @keyup.ctl.a="add(2000,2000)""><hr>
        <button @click="toggle">切换显示状态</button><br>{{web.show}}
        <p v-if="web.user < 1000">新网站</p>
        <p v-else-if="web.user >= 1000 && web.user < 10000">优秀网站</p>
        <p v-else>资深网站</p>
    </div>
    <script type="module">
        import {createApp, reactive, ref} from "../downloads/vue.esm-browser-3.5.44.js"
        createApp({
            setup() {
                const web = reactive({
                    title: "haha",
                    url: "https://baidu.com",
                    user: 0,
                    show: true
                })
                // const num = ref(10)
                // num.value += 1
                const num = ref([1,2,3])
                const edit = () =>{
                    web.url = "https://www.google.com"
                }
                const add = (a,b) =>{
                    web.user += a+b
                }
                const toggle = () =>{
                    web.show = !web.show
                }
                return {
                    msg: "你好！",
                    num,
                    edit,
                    add,
                    web,
                    toggle
                };
            }
        }).mount("#app ")

    </script>
</body>
</html>
