<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        {{msg}}

        <h2>title: {{ web.title }}</h2>
        <h2>url: {{ web.url }}</h2>
        <h2>num: {{num}}</h2>
        <h2>user: {{web.user}}</h2>
        <button v-on:click="edit">修改url</button><br>
        <button @click="edit">修改url-简写形式</button><hr>
        会车 <input type="text" @:keyup.enter="add(10,20)">
    </div>
    <script type="module">
        import {createApp, reactive, ref} from "../downloads/vue.esm-browser-3.5.44.js"
        createApp({
            setup() {
                const web = reactive({
                    title: "haha",
                    url: "https://baidu.com",
                    user: 0
                })
                // const num = ref(10)
                // num.value += 1
                const num = ref([1,2,3])
                const edit = () =>{
                    web.url = "https://www.google.com"
                }
                const add = (a,b) =>{
                    web.user += a+b
                }
                return {
                    msg: "你好！",
                    num,
                    edit,
                    add,
                    web
                };
            }
        }).mount("#app ")

    </script>
</body>
</html>
